{% extends 'common/base.html' %}

{% block content %}
<div class="container">
    <h1 class="mb-4">Recent Reviews</h1>
    <div class="row">
        {% for review in reviews %}
        <div class="col-md-6 mb-4">
            <div class="card">
                <div class="card-body">
                    <h5 class="card-title">
                        <a href="{% url 'books:detail' review.book.slug %}">{{ review.book.title }}</a>
                    </h5>
                    <h6 class="card-subtitle mb-2 text-muted">Rating: {{ review.rating }} by {{ review.author }}</h6>
                    <p class="card-text">{{ review.body|truncatewords:3 }}</p>
                    <a href="{% url 'reviews:details' review.pk %}" class="btn btn-primary">View Review</a>
                </div>
            </div>
        </div>
        {% empty %}
            <h1>No reviews yet.</h1>
        {% endfor %}
    </div>
</div>
{% endblock %}
