<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Travel Board{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --travel-ink: #17202a;
            --travel-muted: #64748b;
            --travel-page: #f6f8fb;
            --travel-panel: #ffffff;
            --travel-teal: #0f766e;
            --travel-coral: #e76f51;
            --travel-sky: #2563eb;
            --travel-gold: #f6c453;
            --travel-line: #dbe3ef;
        }

        body {
            background: var(--travel-page);
            color: var(--travel-ink);
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        .navbar {
            backdrop-filter: saturate(160%) blur(14px);
            background: rgba(255, 255, 255, 0.94);
            border-bottom: 1px solid rgba(219, 227, 239, 0.92);
        }

        .navbar-brand {
            color: var(--travel-ink);
            font-weight: 800;
        }

        .brand-mark {
            align-items: center;
            background: var(--travel-teal);
            border-radius: 8px;
            color: #ffffff;
            display: inline-flex;
            font-size: 0.88rem;
            font-weight: 800;
            height: 2.25rem;
            justify-content: center;
            width: 2.25rem;
        }

        .nav-link {
            border-radius: 999px;
            color: #475569;
            font-weight: 650;
            padding-inline: 1rem !important;
        }

        .nav-link:hover,
        .nav-link.active {
            background: #e9f7f5;
            color: var(--travel-teal) !important;
        }

        .btn-brand {
            background: var(--travel-coral);
            border-color: var(--travel-coral);
            color: #ffffff;
            font-weight: 700;
        }

        .btn-brand:hover,
        .btn-brand:focus {
            background: #d55c40;
            border-color: #d55c40;
            color: #ffffff;
        }

        .hero-band {
            background: #ffffff;
            border-bottom: 1px solid var(--travel-line);
        }

        .eyebrow {
            color: var(--travel-teal);
            font-size: 0.78rem;
            font-weight: 800;
            letter-spacing: 0;
            margin-bottom: 0.8rem;
            text-transform: uppercase;
        }

        .hero-title {
            font-size: clamp(2.35rem, 6vw, 4.9rem);
            font-weight: 850;
            letter-spacing: 0;
            line-height: 0.98;
            max-width: 11ch;
        }

        .hero-copy,
        .section-copy {
            color: var(--travel-muted);
            font-size: 1.05rem;
            line-height: 1.7;
        }

        .stats-grid {
            display: grid;
            gap: 1rem;
            grid-template-columns: repeat(2, minmax(0, 1fr));
        }

        .stat-tile {
            background: #f8fafc;
            border: 1px solid var(--travel-line);
            border-radius: 8px;
            min-height: 9.5rem;
            padding: 1.3rem;
        }

        .stat-tile strong {
            color: var(--travel-sky);
            display: block;
            font-size: clamp(2rem, 5vw, 3.4rem);
            line-height: 1;
        }

        .stat-tile span {
            color: var(--travel-muted);
            display: block;
            font-weight: 700;
            margin-top: 0.75rem;
        }

        .section-title {
            font-size: clamp(1.65rem, 3vw, 2.4rem);
            font-weight: 820;
            letter-spacing: 0;
        }

        .destination-card,
        .review-card,
        .empty-state {
            border: 1px solid var(--travel-line);
            border-radius: 8px;
            box-shadow: 0 16px 40px rgba(15, 23, 42, 0.06);
        }

        .destination-card {
            min-height: 20rem;
        }

        .review-card {
            min-height: 16rem;
        }

        .destination-letter {
            align-items: center;
            background: #e9f7f5;
            border: 1px solid #b8e4de;
            border-radius: 8px;
            color: var(--travel-teal);
            display: inline-flex;
            font-weight: 850;
            height: 3rem;
            justify-content: center;
            width: 3rem;
        }

        .country-pill {
            background: #fff7df;
            border: 1px solid #ffe6a3;
            border-radius: 999px;
            color: #7a5600;
            display: inline-flex;
            font-size: 0.82rem;
            font-weight: 750;
            padding: 0.35rem 0.75rem;
        }

        .rating-badge {
            background: var(--travel-sky);
            border-radius: 999px;
            color: #ffffff;
            display: inline-flex;
            font-weight: 800;
            padding: 0.38rem 0.8rem;
        }

        .status-badge {
            border-radius: 999px;
            font-weight: 750;
            padding: 0.4rem 0.75rem;
        }

        .status-badge.active {
            background: #dcfce7;
            color: #166534;
        }

        .status-badge.inactive {
            background: #fee2e2;
            color: #991b1b;
        }

        .detail-panel {
            background: var(--travel-teal);
            color: #ffffff;
        }

        .detail-panel .section-copy {
            color: rgba(255, 255, 255, 0.78);
        }

        .detail-meta {
            background: rgba(255, 255, 255, 0.13);
            border: 1px solid rgba(255, 255, 255, 0.24);
            border-radius: 8px;
            color: #ffffff;
            padding: 1rem;
        }

        .footer-link {
            color: var(--travel-teal);
            font-weight: 750;
            text-decoration: none;
        }

        .footer-link:hover {
            color: #0b5f58;
            text-decoration: underline;
        }

        @media (max-width: 575.98px) {
            .hero-title {
                max-width: 100%;
            }

            .stats-grid {
                grid-template-columns: 1fr;
            }

            .nav-link {
                border-radius: 8px;
                padding-inline: 0.75rem !important;
            }
        }
    </style>
</head>
<body class="d-flex min-vh-100 flex-column">
    {% with namespace=request.resolver_match.namespace url_name=request.resolver_match.url_name %}
        <nav class="navbar navbar-expand-lg sticky-top">
            <div class="container py-2">
                <a class="navbar-brand d-flex align-items-center gap-2" href="{% url 'destinations:dashboard' %}">
                    <span class="brand-mark">TB</span>
                    <span>Travel Board</span>
                </a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNavbar" aria-controls="mainNavbar" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="mainNavbar">
                    <ul class="navbar-nav ms-auto align-items-lg-center gap-lg-1">
                        <li class="nav-item">
                            <a class="nav-link {% if namespace == 'destinations' and url_name == 'dashboard' %}active{% endif %}" href="{% url 'destinations:dashboard' %}" {% if namespace == 'destinations' and url_name == 'dashboard' %}aria-current="page"{% endif %}>Dashboard</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link {% if namespace == 'destinations' and url_name == 'list' %}active{% endif %}" href="{% url 'destinations:list' %}" {% if namespace == 'destinations' and url_name == 'list' %}aria-current="page"{% endif %}>Destinations</a>
                        </li>
                        <li class="nav-item ms-lg-2">
                            <a class="btn btn-brand btn-sm px-3" href="{% url 'destinations:redirect' %}">SoftUni</a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
    {% endwith %}

    <main class="flex-grow-1">
        {% block content %}{% endblock %}
    </main>

    <footer class="bg-white border-top py-4">
        <div class="container d-flex flex-column flex-md-row align-items-start align-items-md-center justify-content-between gap-2">
            <span class="text-secondary small">Django Basics travel project</span>
            <a class="footer-link small" href="{% url 'destinations:list' %}">Browse all destinations</a>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
