{% extends 'common/base.html' %}
{% load stars %}

{% block content %}
<div class="container">
    <div class="card">
        <div class="card-header">
            <h1>Review for {{ review.book.title }}</h1>
        </div>
        <div class="card-body">
            <blockquote class="blockquote mb-0">
                <p>{{ review.body }}</p>
                <footer class="blockquote-footer">
                    {{ review.author }}
                    <cite title="Source Title">
                        with a rating of {{ review.rating }} {{ review.rating|stars }}
                    </cite>
                </footer>
            </blockquote>

            <a href="{% url 'books:detail' review.book.slug %}" class="btn btn-secondary mt-3">Back to Book Details</a>
        </div>
    </div>
</div>
{% endblock %}
